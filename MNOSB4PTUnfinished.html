<style>
:root {
  --theme-color: #a855f7;
  --theme-rgb: 168, 85, 247;
  --screen-brightness: 1;
}

@font-face {
  font-family: 'Atari';
  src: url('https://fonts.cdnfonts.com/s/14882/AtariClassic-Regular.woff') format('woff');
}

/* GLOBAL CUSTOM CURSOR - ☞ Rotated Up, Glowing */
* {
  cursor: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='1.5' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Ctext x='16' y='16' font-size='22' fill='%23a855f7' filter='url(%23glow)' transform='rotate(-90 16 16)' text-anchor='middle' dominant-baseline='central'%3E☞%3C/text%3E%3C/svg%3E") 16 4, auto !important;
}

body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: 'Atari', monospace;
  color: var(--theme-color);
  user-select: none;
}

/* CRT EFFECT */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(var(--theme-rgb),0.08),
    rgba(var(--theme-rgb),0.08) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events: none;
  animation: flicker 0.15s infinite;
  z-index: 999;
}

@keyframes flicker {
  0% { opacity: 0.9; }
  50% { opacity: 1; }
  100% { opacity: 0.92; }
}

#screen {
  width: 100vw;
  height: 100vh;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: inset 0 0 120px rgba(var(--theme-rgb),0.4);
  filter: brightness(var(--screen-brightness));
}

#boot {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  padding: 40px;
  white-space: pre-line;
  font-size: 14px;
  line-height: 1.8;
  font-family: 'Press Start 2P', 'Atari', monospace; 
  -webkit-font-smoothing: none; 
}

#os {
  display: none;
  width: 100%;
  height: 100%;
  position: relative;
}

.draggable-container {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 100;
  transition: transform 0.1s ease-out;
}

.menu-icon {
  font-size: 55px;
  color: var(--theme-color);
  text-align: center;
  line-height: 1;
  text-shadow: 0 0 10px var(--theme-color), 0 0 25px var(--theme-color), 0 0 40px var(--theme-color);
  font-family: sans-serif;
}

.symbol-label {
  margin-top: 10px;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  opacity: 0;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
}

.fade-out {
  animation: fadeOutLabel 2.5s forwards;
}

@keyframes fadeOutLabel {
  0% { opacity: 1; transform: translateY(0); }
  20% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(10px); }
}

.star {
  position: absolute;
  color: var(--theme-color);
  animation: twinkle 2s infinite alternate;
  font-size: 18px;
}

@keyframes twinkle {
  from { opacity: 0.3; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1.3); }
}

.ring {
  position: absolute;
  top: 45%;
  left: 50%;
  width: 600px;
  height: 600px;
  border: 5px solid var(--theme-color);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 40px var(--theme-color);
  z-index: 1;
}

.planet {
  position: absolute;
  top: 45%;
  left: 50%;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, var(--theme-color), black);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 40px var(--theme-color);
  z-index: 2;
}

.bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 90px;
  display: flex;
  background: black;
  z-index: 200;
}

.slot {
  flex: 1;
  border-top: 4px solid var(--theme-color);
  border-right: 2px solid var(--theme-color);
  box-shadow: 0 0 20px var(--theme-color) inset;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  color: var(--theme-color);
  text-shadow: 0 0 10px var(--theme-color), 0 0 25px var(--theme-color), 0 0 40px var(--theme-color);
  font-family: sans-serif;
}

.slot:last-child {
  border-right: none;
}

@keyframes levitate {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.slot-icon {
  display: inline-block;
  pointer-events: none;
}

.slot:hover .slot-icon {
  animation: levitate 1.5s infinite ease-in-out;
}

#custom-tooltip {
  position: fixed;
  pointer-events: none;
  opacity: 0;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  z-index: 1000;
  transition: opacity 0.1s;
  white-space: nowrap;
}

.os-window {
  position: absolute;
  width: 320px;
  background: rgba(15, 5, 25, 0.85); 
  border: 2px solid var(--theme-color);
  box-shadow: 0 0 15px rgba(var(--theme-rgb),0.6), inset 0 0 10px rgba(var(--theme-rgb),0.2);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(5px);
  font-family: 'Press Start 2P', monospace;
  z-index: 500;
}

.os-window-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(var(--theme-rgb), 0.2);
  border-bottom: 2px solid var(--theme-color);
  padding: 8px 12px;
}

.os-window-close {
  color: var(--theme-color);
  font-size: 14px;
  text-shadow: 0 0 5px var(--theme-color);
  transition: color 0.2s, text-shadow 0.2s;
  user-select: none;
}

.os-window-close:hover {
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 20px var(--theme-color);
}

.os-window-btn {
  color: var(--theme-color);
  font-size: 14px;
  text-shadow: 0 0 5px var(--theme-color);
  transition: color 0.2s, text-shadow 0.2s;
  user-select: none;
  cursor: inherit;
}

.os-window-btn:hover {
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 20px var(--theme-color);
}

.fav-btn.active {
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 20px var(--theme-color);
}

.os-window-title {
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  flex-grow: 1;
  text-align: center;
  pointer-events: none;
}

.os-window-spacer {
  width: 14px; 
}

.os-window-content {
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-height: 65vh;
  overflow-y: auto;
}

.os-window-content::-webkit-scrollbar {
  width: 6px;
}
.os-window-content::-webkit-scrollbar-track {
  background: rgba(var(--theme-rgb), 0.1);
}
.os-window-content::-webkit-scrollbar-thumb {
  background: var(--theme-color);
  box-shadow: 0 0 5px var(--theme-color);
}

/* BROWSER WINDOW STYLES */
.resizable-window {
  resize: both;
  overflow: hidden;
  min-width: 350px;
  min-height: 250px;
}

.browser-content {
  padding: 0 !important;
  max-height: none !important;
  height: calc(100% - 35px) !important;
  overflow: hidden !important;
  display: flex !important;
}

.os-window-link {
  font-size: 11px;
  color: var(--theme-color);
  text-shadow: 0 0 8px var(--theme-color);
  text-decoration: none;
  transition: all 0.2s;
  text-align: center;
  line-height: 1.5;
}

.os-window-link:hover {
  color: #fff;
  text-shadow: 0 0 12px #fff, 0 0 25px var(--theme-color);
  transform: scale(1.05);
}

.os-text-content {
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  line-height: 1.8;
  text-align: left;
  white-space: pre-line;
}

.start-menu-link {
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 8px var(--theme-color);
  text-decoration: none;
  transition: all 0.2s;
  text-align: left;
  line-height: 1.5;
  display: block;
}

.start-menu-link:hover {
  color: #fff;
  text-shadow: 0 0 12px #fff, 0 0 25px var(--theme-color);
  transform: scale(1.02) translateX(5px);
}

.gb-input, .gb-textarea, select.gb-input {
  background: #000;
  color: var(--theme-color);
  font-family: 'Atari', monospace;
  border: 1px solid var(--theme-color);
  box-shadow: 0 0 8px rgba(var(--theme-rgb),0.3), inset 0 0 8px rgba(var(--theme-rgb),0.3);
  text-shadow: 0 0 5px var(--theme-color);
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 12px;
  font-size: 10px;
  outline: none;
}
.gb-textarea {
  resize: none;
  height: 70px;
}
.gb-btn {
  background: #000;
  color: var(--theme-color);
  font-family: 'Atari', monospace;
  border: 1px solid var(--theme-color);
  box-shadow: 0 0 8px rgba(var(--theme-rgb),0.3), inset 0 0 8px rgba(var(--theme-rgb),0.3);
  text-shadow: 0 0 5px var(--theme-color);
  padding: 10px 15px;
  font-size: 10px;
  transition: all 0.2s;
  width: 100%;
}
.gb-btn:hover {
  background: var(--theme-color);
  color: #000;
  box-shadow: 0 0 15px var(--theme-color), inset 0 0 10px #000;
  text-shadow: none;
}
.gb-entries-container {
  margin-top: 15px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 5px;
}
.gb-entries-container::-webkit-scrollbar {
  width: 6px;
}
.gb-entries-container::-webkit-scrollbar-track {
  background: rgba(var(--theme-rgb), 0.1);
}
.gb-entries-container::-webkit-scrollbar-thumb {
  background: var(--theme-color);
  box-shadow: 0 0 5px var(--theme-color);
}
.gb-entry {
  margin-bottom: 15px;
  font-size: 10px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  line-height: 1.6;
  border-top: 1px dashed rgba(var(--theme-rgb),0.5);
  padding-top: 10px;
  word-wrap: break-word;
  white-space: pre-wrap;
}

/* PROGRESS BAR STYLES */
.progress-bg {
  width: 100%;
  height: 20px;
  background: #000;
  border: 1px solid var(--theme-color);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--theme-color);
  width: 0%;
  box-shadow: 0 0 15px var(--theme-color);
}

/* FOLDER GRID STYLES */
.folder-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  justify-items: center;
}
.folder-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: inherit;
  width: 80px;
  text-align: center;
  transition: transform 0.2s;
}
.folder-item:hover {
  transform: scale(1.05);
}
.folder-icon {
  font-size: 35px;
  color: var(--theme-color);
  text-shadow: 0 0 10px var(--theme-color), 0 0 20px var(--theme-color);
  margin-bottom: 8px;
  font-family: sans-serif;
  line-height: 1;
}
.folder-label {
  font-size: 8px;
  color: var(--theme-color);
  text-shadow: 0 0 5px var(--theme-color);
  font-family: 'Press Start 2P', monospace;
  line-height: 1.4;
}

/* CALENDAR STYLES */
.calendar-day {
  width: 35px;
  height: 35px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(var(--theme-rgb),0.4);
  cursor: inherit;
  font-size: 10px;
  color: var(--theme-color);
  font-family: 'Press Start 2P', monospace;
  position: relative;
  transition: background 0.2s, transform 0.2s;
}
.calendar-day:hover {
  background: rgba(var(--theme-rgb),0.3);
  transform: scale(1.1);
}
.calendar-day.marked {
  box-shadow: 0 0 15px var(--theme-color), inset 0 0 10px var(--theme-color);
  border: 1px solid var(--theme-color);
  color: #fff;
  text-shadow: 0 0 5px #fff;
}

/* CUSTOM BRIGHTNESS SLIDER */
.brightness-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: rgba(var(--theme-rgb), 0.3);
  outline: none;
  margin: 20px 0;
}
.brightness-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  background: var(--theme-color);
  cursor: pointer;
  box-shadow: 0 0 10px var(--theme-color);
}
</style>
</head>

function translateStr(str) {
    if (!str) return str;
    let key = str.trim();
    if (currentLang === 'en') return key;
    if (i18n[currentLang] && i18n[currentLang][key]) {
        return i18n[currentLang][key];
    }
    return key;
}

function translateNode(el) {
    if(!el.dataset.en) el.dataset.en = el.innerText;
    el.innerText = translateStr(el.dataset.en);
}

function applyTranslations(root = document) {
    const selectors = ['.start-menu-link', '.symbol-label', '.os-window-title', '.os-window-link', '.folder-label', '.gb-btn'];
    selectors.forEach(sel => {
        root.querySelectorAll(sel).forEach(translateNode);
        if (root.matches && root.matches(sel)) translateNode(root);
    });
    
    const tooltipNodes = root.querySelectorAll('.slot');
    tooltipNodes.forEach(el => {
        if(!el.dataset.en) el.dataset.en = el.getAttribute('data-tooltip');
        el.setAttribute('data-tooltip', translateStr(el.dataset.en));
    });
    if (root.matches && root.matches('.slot')) {
        if(!root.dataset.en) root.dataset.en = root.getAttribute('data-tooltip');
        root.setAttribute('data-tooltip', translateStr(root.dataset.en));
    }
}

function setLanguage(lang) {
    currentLang = lang;
    applyTranslations(document);
    const win = document.getElementById('win-language');
    if (win) win.remove();
}

// --- DRAG LOGIC ---
let activeElement = null;
let offset = { x: 0, y: 0 };
let isDragging = false;
let startPos = { x: 0, y: 0 };

const containers = document.querySelectorAll('.draggable-container');

containers.forEach(container => {
  container.addEventListener('mousedown', startDrag);
  container.addEventListener('touchstart', startDrag, { passive: false });

  container.addEventListener('click', (e) => {
    const dist = Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y);
    if (dist < 5) {
      showLabel(container);
    }
  });
});

function startDrag(e) {
  activeElement = e.currentTarget;
  const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
  const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
  
  startPos.x = clientX;
  startPos.y = clientY;
  
  const rect = activeElement.getBoundingClientRect();
  offset.x = clientX - rect.left;
  offset.y = clientY - rect.top;
  
  isDragging = true;
  document.addEventListener('mousemove', drag);
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchmove', drag, { passive: false });
  document.addEventListener('touchend', endDrag);
}

function drag(e) {
  if (!isDragging || !activeElement) return;
  e.preventDefault();

  const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
  const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

  let x = clientX - offset.x;
  let y = clientY - offset.y;

  const winW = window.innerWidth;
  const winH = window.innerHeight - 100;

  x = Math.max(0, Math.min(x, winW - activeElement.offsetWidth));
  y = Math.max(0, Math.min(y, winH - activeElement.offsetHeight));

  activeElement.style.left = x + 'px';
  activeElement.style.top = y + 'px';
}

function askRecycleFile(appElement, appName, isMergedFile) {
   const winId = 'win-recycle-file-' + Math.floor(Math.random() * 1000);
   createOSWindow(winId, 'Delete or remove from desktop?', [
      { label: 'Delete', action: () => {
          appElement.remove();
          if(isMergedFile) {
              dynamicFileSystem = dynamicFileSystem.filter(f => f.label !== appName);
              const w = document.getElementById('win-files');
              if(w) { w.remove(); openFilesWindow(); }
          }
          document.getElementById(winId)?.remove();
      }},
      { label: 'Remove from desktop', action: () => {
          appElement.remove();
          document.getElementById(winId)?.remove();
      }}
   ], 250, 200);
}

function endDrag() {
  if (isDragging && activeElement) {
    const recycleBin = document.getElementById('recycle-bin');
    if (activeElement !== recycleBin && activeElement.classList.contains('draggable-container')) {
      const rect1 = activeElement.getBoundingClientRect();
      const rect2 = recycleBin.getBoundingClientRect();
      
      const overlap = !(rect1.right < rect2.left || 
                        rect1.left > rect2.right || 
                        rect1.bottom < rect2.top || 
                        rect1.top > rect2.bottom);
                        
      if (overlap) {
        const isMergedApp = activeElement.classList.contains('merged-app');
        const isMergedFile = activeElement.classList.contains('merged-file-app');
        const isStandardShortcut = activeElement.classList.contains('standard-shortcut');
        const appName = activeElement.getAttribute('data-label') || (activeElement.querySelector('.symbol-label') ? activeElement.querySelector('.symbol-label').innerText : 'App');
        
        if (isMergedFile || isStandardShortcut) {
           askRecycleFile(activeElement, appName, isMergedFile);
        } else {
           askRecycle(activeElement, !isMergedApp, appName);
        }
      }
    }
  }

  isDragging = false;
  activeElement = null;
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('touchend', endDrag);
}

function showLabel(container) {
  const label = container.querySelector('.symbol-label');
  label.classList.remove('fade-out');
  void label.offsetWidth; 
  label.classList.add('fade-out');
}

function openBrowserWindow(titleText, url) {
  const id = 'win-browser-' + Math.floor(Math.random() * 10000);
  let existingWin = document.getElementById(id);
  if (existingWin) { existingWin.style.zIndex = ++windowZIndexCounter; return; }

  const win = document.createElement('div');

  win.style.width = '70vw';
  win.style.height = '65vh';
  const safeX = Math.max(20, (window.innerWidth * 0.15));
  const safeY = Math.max(20, (window.innerHeight * 0.15));
  win.style.left = safeX + 'px';
  win.style.top = safeY + 'px';
  win.style.zIndex = ++windowZIndexCounter;

  const bringToFront = () => win.style.zIndex = ++windowZIndexCounter;
  win.addEventListener('mousedown', bringToFront);
  win.addEventListener('touchstart', bringToFront, {passive: true});

  const header = document.createElement('div');
  header.className = 'os-window-header';

  const closeBtn = document.createElement('div');
  closeBtn.className = 'os-window-close';
  closeBtn.innerText = 'X';
  closeBtn.onclick = () => win.remove();

  const title = document.createElement('div');
  title.className = 'os-window-title';
  title.innerText = titleText;
  title.style.flexGrow = '1';
  title.style.textAlign = 'left';
  title.style.paddingLeft = '15px';
  title.style.pointerEvents = 'none';

  const controls = document.createElement('div');
  controls.style.display = 'flex';
  controls.style.gap = '10px';
  controls.style.alignItems = 'center';
  controls.style.pointerEvents = 'auto';

  const content = document.createElement('div');
  content.className = 'os-window-content browser-content';
  
  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  iframe.style.backgroundColor = '#fff';

  // Back Button
  const backBtn = document.createElement('div');
  backBtn.className = 'os-window-btn';
  backBtn.innerText = '◀';
  backBtn.onclick = (e) => {
      e.stopPropagation();
      try { iframe.contentWindow.history.back(); } catch(err) {}
  };

  // Forward Button
  const fwdBtn = document.createElement('div');
  fwdBtn.className = 'os-window-btn';
  fwdBtn.innerText = '▶';
  fwdBtn.onclick = (e) => {
      e.stopPropagation();
      try { iframe.contentWindow.history.forward(); } catch(err) {}
  };

  // Favorite Button
  const favBtn = document.createElement('div');
  favBtn.className = 'os-window-btn fav-btn';
  const isFav = favoritePages.some(p => p.url === url);
  if(isFav) favBtn.classList.add('active');
  favBtn.innerText = isFav ? '⚑' : '⚐';
  favBtn.onclick = (e) => {
      e.stopPropagation();
      if(favoritePages.some(p => p.url === url)) return; // already added
      
      const confirmId = 'win-fav-confirm-' + Math.floor(Math.random()*1000);
      createOSWindow(confirmId, 'Add to favorites?', [
          { label: 'Yes', action: () => {
              favoritePages.push({label: titleText, url: url});
              favBtn.classList.add('active');
              favBtn.innerText = '⚑';
              document.getElementById(confirmId)?.remove();
          }},
          { label: 'No', action: () => {
              document.getElementById(confirmId)?.remove();
          }}
      ], safeX + 40, safeY + 40);
  };

  let preMaxBounds = { w: '', h: '', x: '', y: '' };

  // Minimize (Restore) Button
  const minBtn = document.createElement('div');
  minBtn.className = 'os-window-btn';
  minBtn.innerText = '🗗';
  minBtn.onclick = (e) => {
      e.stopPropagation();
      if(win.getAttribute('data-maximized') === 'true') {
          win.style.width = preMaxBounds.w;
          win.style.height = preMaxBounds.h;
          win.style.left = preMaxBounds.x;
          win.style.top = preMaxBounds.y;
          win.classList.add('resizable-window');
          win.setAttribute('data-maximized', 'false');
      }
  };

  // Maximize Button
  const maxBtn = document.createElement('div');
  maxBtn.className = 'os-window-btn';
  maxBtn.innerText = '🗖';
  maxBtn.onclick = (e) => {
      e.stopPropagation();
      if(win.getAttribute('data-maximized') !== 'true') {
          preMaxBounds = { w: win.style.width, h: win.style.height, x: win.style.left, y: win.style.top };
          win.style.width = '100vw';
          win.style.height = 'calc(100vh - 90px)'; // leave room for bottom bar
          win.style.left = '0px';
          win.style.top = '0px';
          win.classList.remove('resizable-window');
          win.setAttribute('data-maximized', 'true');
      }
  };

  controls.appendChild(backBtn);
  controls.appendChild(fwdBtn);
  controls.appendChild(favBtn);
  controls.appendChild(minBtn);
  controls.appendChild(maxBtn);

  header.appendChild(closeBtn);
  header.appendChild(title);
  header.appendChild(controls);
  win.appendChild(header);

  content.appendChild(iframe);
  win.appendChild(content);

  document.getElementById('os').appendChild(win);
  makeWindowDraggable(win, header);
}

function makeWindowDraggable(win, header) {
  let isDraggingWin = false;
  let startX, startY, initialX, initialY;

  const dragStart = (e) => {
    // Ignore clicks on header buttons and do not drag if maximized
    if (e.target.classList.contains('os-window-close') || e.target.classList.contains('os-window-btn')) return;
    if (win.getAttribute('data-maximized') === 'true') return;
    
    isDraggingWin = true;
    win.style.zIndex = ++windowZIndexCounter;
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    startX = clientX;
    startY = clientY;
    initialX = win.offsetLeft;
    initialY = win.offsetTop;
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragEnd);
    document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('touchend', dragEnd);
  };

  const dragMove = (e) => {
    if (!isDraggingWin) return;
    e.preventDefault();
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    const dx = clientX - startX;
    const dy = clientY - startY;
    
    let newX = initialX + dx;
    let newY = initialY + dy;
    
    // Prevent eclipsing screen bounds so X is always reachable
    newX = Math.max(-win.offsetWidth + 60, Math.min(newX, window.innerWidth - 60));
    newY = Math.max(0, Math.min(newY, window.innerHeight - 40));
    
    win.style.left = newX + 'px';
    win.style.top = newY + 'px';
  };

  const dragEnd = () => {
    isDraggingWin = false;
    document.removeEventListener('mousemove', dragMove);
    document.removeEventListener('mouseup', dragEnd);
    document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('touchend', dragEnd);
  };

  header.addEventListener('mousedown', dragStart);
  header.addEventListener('touchstart', dragStart, { passive: false });
}

  document.documentElement.style.setProperty('--theme-color', hex);

  const svgCursor = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='1.5' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Ctext x='16' y='16' font-size='22' fill='%23${hex.substring(1)}' filter='url(%23glow)' transform='rotate(-90 16 16)' text-anchor='middle' dominant-baseline='central'%3E☞%3C/text%3E%3C/svg%3E`;
  
  let style = document.getElementById('dynamic-cursor');
  if (!style) {
    style = document.createElement('style');
    style.id = 'dynamic-cursor';
    document.head.appendChild(style);

  style.innerHTML = `* { cursor: url("${svgCursor}") 16 4, auto !important; }`;

  stickyNoteCount++;

  container.ondblclick = () => {
    openDesktopIconMenu(name, container, () => {
       const screenCenterX = Math.max(20, (window.innerWidth / 2) - 160);
       const screenCenterY = Math.max(20, (window.innerHeight / 2) - 100);
       createOSTextWindow('win-sticky-' + stickyNoteCount, name, text, screenCenterX, screenCenterY);
    });
  };

  let lastTap = 0;
  container.addEventListener('touchend', (e) => {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;
    if (tapLength < 400 && tapLength > 0) { 
        openDesktopIconMenu(name, container, () => {
           const screenCenterX = Math.max(20, (window.innerWidth / 2) - 160);
           const screenCenterY = Math.max(20, (window.innerHeight / 2) - 100);
           createOSTextWindow('win-sticky-' + stickyNoteCount, name, text, screenCenterX, screenCenterY);
        });
        e.preventDefault(); 
    }
    lastTap = currentTime;
  });

  document.getElementById('os').appendChild(container);
  
  // Re-init drag for new sticky icon
  container.addEventListener('mousedown', startDrag);
  container.addEventListener('touchstart', startDrag, { passive: false });
}

function renderMonthDays(month, container) {
  container.innerHTML = '';
  const days = monthDays[month];
  for(let i=1; i<=days; i++) {
    const dayStr = month + '-' + i;
    const isMarked = !!markedDatesData[dayStr];
    
    const dayDiv = document.createElement('div');
    dayDiv.className = 'calendar-day';
    
    if(isMarked) {
      dayDiv.classList.add('marked');
      dayDiv.innerHTML = `${i}<br><span style="font-size:8px; margin-top:3px;">⚐</span>`;
    } else {
      dayDiv.innerText = i;
    }

    dayDiv.onclick = () => askMarkImportant(month, i, dayStr);
    container.appendChild(dayDiv);
  }
}

function startFileMergeProcess(file1, file2) {
  const win = document.createElement('div');
  win.className = 'os-window'; win.style.width = '300px'; 
  const safeX = Math.max(0, Math.min(300, window.innerWidth - 100));
  const safeY = Math.max(0, Math.min(200, window.innerHeight - 50));
  win.style.left = safeX + 'px'; win.style.top = safeY + 'px';
  win.style.zIndex = ++windowZIndexCounter;
  
  const content = document.createElement('div');
  content.className = 'os-window-content';
  content.innerHTML = `<div style="font-size:10px; margin-bottom:10px;">MERGING FILES...</div><div class="progress-bg"><div id="file-merge-bar" class="progress-fill"></div></div>`;
  win.appendChild(content);
  document.getElementById('os').appendChild(win);

  for(let i=0; i<5; i++){
    let s = document.createElement('div'); s.className='star'; s.innerText='*';
    s.style.left=Math.random()*90+'%'; s.style.top=Math.random()*90+'%';
    content.appendChild(s);
  }

  let prog = 0;
  function updateBar() {
    let speed = Math.random() > 0.7 ? 5 : 1;
    prog += speed;
    const bar = document.getElementById('file-merge-bar');
    if (bar) bar.style.width = prog + '%';
    if(prog < 100) setTimeout(updateBar, 50);
    else {
      win.remove();
      finishFileMerge(file1, file2);
    }
  }
  updateBar();
}

function finishFileMerge(file1, file2) {
  const unstable = ["Donate", "Pictures", "Create a file", "Pre-Installed Games"];
  if (unstable.includes(file1.label) || unstable.includes(file2.label)) {
    createOSTextWindow('win-merge-err', 'Error', 'Unable to merge due to Unstable Software.', 300, 200);
    return;
  }
  promptFileMergeName(file1, file2);
}

function finalizeFileMerge(file1, file2, name) {
  let items1 = extractFileItems(file1);
  let items2 = extractFileItems(file2);
  let combinedItems = [...items1, ...items2];
  
  let newFile = {
    label: name,
    icon: '🗁',
    mergedItems: combinedItems,
    action: () => {
       createOSWindow('win-merged-file-' + Math.floor(Math.random()*10000), name, combinedItems, 250, 250);
    }
  };
  
  dynamicFileSystem.push(newFile);
  
  const filesWin = document.getElementById('win-files');
  if(filesWin) {
      filesWin.remove();
      openFilesWindow();
  }
  
  askDesktopShortcut(newFile);
}

function createFileDesktopShortcut(fileObj, isMerged = true) {
  const container = document.createElement('div');
  container.className = 'draggable-container ' + (isMerged ? 'merged-file-app' : 'standard-shortcut');
  container.setAttribute('data-merged-name', fileObj.label);
  container.setAttribute('data-label', fileObj.label);
  
  const randX = 20 + Math.random() * 40;
  const randY = 20 + Math.random() * 40;
  container.style.left = randX + 'vw'; 
  container.style.top = randY + 'vh';
  
  container.innerHTML = `<div class="menu-icon">🗁</div><div class="symbol-label">${fileObj.label}</div>`;
  
  container.onclick = () => {
    const label = container.querySelector('.symbol-label');
    label.classList.remove('fade-out'); void label.offsetWidth; label.classList.add('fade-out');
  };

  container.ondblclick = () => {
    openDesktopIconMenu(fileObj.label, container, () => {
       if (fileObj.action) fileObj.action();
    });
  };

  let lastTap = 0;
  container.addEventListener('touchend', (e) => {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;
    if (tapLength < 400 && tapLength > 0) { 
        openDesktopIconMenu(fileObj.label, container, () => {
           if (fileObj.action) fileObj.action();
        });
        e.preventDefault(); 
    }
    lastTap = currentTime;
  });

  document.getElementById('os').appendChild(container);
  container.addEventListener('mousedown', startDrag);
  container.addEventListener('touchstart', startDrag, { passive: false });
}

function createMergedIcon(cat1, cat2, name, iconChar) {
  const containers = document.querySelectorAll('.os-window');
  containers.forEach(c => { if(c.id.includes('merge')) c.remove(); });

  const container = document.createElement('div');
  container.className = 'draggable-container merged-app';
  container.setAttribute('data-merged-name', name);
  container.setAttribute('data-label', name);
  container.style.left = '20vw'; container.style.top = '40vh';
  container.innerHTML = `<div class="menu-icon">${iconChar}</div><div class="symbol-label">${name}</div>`;
  
  container.onclick = () => {
    const label = container.querySelector('.symbol-label');
    label.classList.remove('fade-out'); void label.offsetWidth; label.classList.add('fade-out');
  };

  container.ondblclick = () => {
    openDesktopIconMenu(name, container, () => {
       const combinedSites = [...mergeData.getSites(cat1), ...mergeData.getSites(cat2)];
       const items = combinedSites.map(s => ({ label: s.label, url: s.url }));
       createOSWindow('win-merged-content', name, items, 400, 200);
    });
  };

  let lastTap = 0;
  container.addEventListener('touchend', (e) => {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;
    if (tapLength < 400 && tapLength > 0) { 
        openDesktopIconMenu(name, container, () => {
           const combinedSites = [...mergeData.getSites(cat1), ...mergeData.getSites(cat2)];
           const items = combinedSites.map(s => ({ label: s.label, url: s.url }));
           createOSWindow('win-merged-content', name, items, 400, 200);
        });
        e.preventDefault(); 
    }
    lastTap = currentTime;
  });

  document.getElementById('os').appendChild(container);
  // Re-init drag for new icon
  container.addEventListener('mousedown', startDrag);
  container.addEventListener('touchstart', startDrag, { passive: false });
}

// --- RECYCLE LOGIC ---
function askRecycle(appElement, isBaseApp, appName) {
  const titleText = isBaseApp ? 'Do you want to delete?' : 'Would you like to Recycle?';
  const winId = 'win-recycle-confirm-' + Math.floor(Math.random() * 1000);
  createOSWindow(winId, titleText, [
    { label: 'Yes', action: () => {
        const w = document.getElementById(winId);
        if(w) w.remove();
        startRecycleProcess(appElement, isBaseApp, appName);
    }},
    { label: 'No', action: () => {
        const w = document.getElementById(winId);
        if(w) w.remove();
    }}
  ], 200, 200);
}

function startRecycleProcess(appElement, isBaseApp, appName) {
  const win = document.createElement('div');
  win.className = 'os-window'; win.style.width = '300px'; 
  const safeX = Math.max(0, Math.min(300, window.innerWidth - 100));
  const safeY = Math.max(0, Math.min(200, window.innerHeight - 50));
  win.style.left = safeX + 'px'; win.style.top = safeY + 'px';
  win.style.zIndex = ++windowZIndexCounter;
  
  const content = document.createElement('div');
  content.className = 'os-window-content';
  const barId = 'recycle-bar-' + Math.floor(Math.random() * 1000);
  content.innerHTML = `<div style="font-size:10px; margin-bottom:10px;">DELETING...</div><div class="progress-bg"><div id="${barId}" class="progress-fill"></div></div>`;
  win.appendChild(content);
  document.getElementById('os').appendChild(win);

  for(let i=0; i<5; i++){
    let s = document.createElement('div'); s.className='star'; s.innerText='*';
    s.style.left=Math.random()*90+'%'; s.style.top=Math.random()*90+'%';
    content.appendChild(s);
  }

  let prog = 0;
  function updateBar() {
    let speed = Math.random() > 0.7 ? 5 : 1; 
    prog += speed;
    const bar = document.getElementById(barId);
    if(bar) bar.style.width = prog + '%';
    if(prog < 100) setTimeout(updateBar, 50);
    else {
      win.remove();
      finishRecycle(appElement, isBaseApp, appName);
    }
  }
  updateBar();
}

function finishRecycle(appElement, isBaseApp, appName) {
  if (isBaseApp) {
    createOSTextWindow('win-recycle-error', 'Error', 'You cannot Recycle pre installed Applicationsꜛ!͎ꜜ', 300, 200);
  } else {
    appElement.remove();
  }
}

function openRecycleWindow() {

  if (mergedApps.length === 0) {
    createOSTextWindow('win-recycle-empty', 'Recycle', 'There are no merged apps to recycle.', 200, 200);

  const items = Array.from(mergedApps).map(app => {
    const name = app.getAttribute('data-merged-name');
    return {
      label: name,
      action: () => {
         const w = document.getElementById('win-recycle-list');

         askRecycle(app, false, name);
      }
    };
  });
  
  createOSWindow('win-recycle-list', 'Which Apps would you like to Recycle?', items, 250, 250);
}

function bindDesktopIcon(labelName, openFunction) {
  const icon = document.querySelector(`[data-label="${labelName}"]`);
  if (!icon) return;
  
  // Directly trigger the function on double click for pre-installed icons
  icon.addEventListener('dblclick', (e) => { 
    openFunction(); 
  });
  
  let lastTap = 0;
  icon.addEventListener('touchend', (e) => {
    let currentTime = new Date().getTime();
    let tapLength = currentTime - lastTap;
    if (tapLength < 400 && tapLength > 0) { 
       openFunction(); 
       e.preventDefault(); 
    }
    lastTap = currentTime;
  });
}
